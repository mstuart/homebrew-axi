name: Release

# Manual release: run from the Actions tab (or `gh workflow run release.yml -f bump=patch`).
# Publishes to npm with provenance via OIDC trusted publishing — no NPM_TOKEN secret.
# One-time setup per package: npmjs.com → package → Settings → Trusted Publisher → GitHub Actions.
# Failure ordering is intentional: npm publish happens before pushing the release commit/tag,
# so a registry failure cannot leave a public git tag for an unpublished version.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - name: Upgrade npm (OIDC trusted publishing needs npm >= 11.5; npm 12 needs Node 22+, so pin 11)
        run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - run: npm run build:skill -- --check
      - run: npm test
      - name: Configure git identity
        run: |
          git config user.name "Mark Stuart"
          git config user.email "742884+mstuart@users.noreply.github.com"
      - name: Bump version and tag locally
        id: bump
        run: |
          tag=$(npm version ${{ inputs.bump }} -m 'chore(release): %s')
          version=${tag#v}
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Ensure version is not already published
        run: |
          if npm view "homebrew-axi@${{ steps.bump.outputs.version }}" version >/dev/null 2>&1; then
            echo "homebrew-axi@${{ steps.bump.outputs.version }} is already published; refusing to continue."
            exit 1
          fi
      - name: Pack check
        run: npm pack --dry-run
      - name: Publish to npm (provenance, OIDC — no token)
        run: npm publish --provenance --access public
      - name: Push release commit and tag
        run: git push --atomic origin "HEAD:${{ github.ref_name }}" "${{ steps.bump.outputs.tag }}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.bump.outputs.tag }}" --title "${{ steps.bump.outputs.tag }}" --generate-notes
