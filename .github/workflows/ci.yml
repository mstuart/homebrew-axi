name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Ultracite check
        run: npm run check
      - run: npm run build
      - run: npm run build:skill -- --check
      - run: npm test
      - name: Pack dry run
        run: npm pack --dry-run
      - name: Linux no-brew BREW_MISSING smoke
        run: |
          if command -v brew >/dev/null 2>&1; then
            echo "brew unexpectedly exists on the Linux runner; this smoke must validate the no-brew path."
            exit 1
          fi
          set +e
          output=$(node dist/bin/homebrew-axi.js installed 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 1
          grep -q "BREW_MISSING" <<< "$output"
